name: Build
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang
          sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 100
          sudo update-alternatives --set ld /usr/bin/ld.lld

      - name: Create missing cronet env
        run: |
          mkdir -p cronet
          touch cronet/cronet.env

      - name: Update dependencies
        run: |
          cd donutvpn-sing-box
          go mod tidy
          cd ..
          go mod tidy

      - name: Build Linux amd64
        env:
          CGO_LDFLAGS: "-fuse-ld=lld"
        run: make linux-amd64

      - name: Package Artifact
        run: |
          mkdir -p out/lib
          cp bin/lib/Donut-Core.so out/lib/
          cp bin/DonutCli out/
          cd out && tar -czvf donut-core-linux-amd64.tar.gz lib/Donut-Core.so DonutCli

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut-core
          path: out/donut-core-linux-amd64.tar.gz

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: draft
          name: draft
          prerelease: true
          files: out/donut-core-linux-amd64.tar.gz
