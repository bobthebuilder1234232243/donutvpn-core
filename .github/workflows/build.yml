name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.6
          
      - name: Update dependencies
        run: |
          go clean -modcache
          cd donutvpn-sing-box
          go mod tidy
          cd ..
          go mod tidy
          
      - name: Build Linux amd64
        run: make linux-amd64
        
      - name: Package Artifact
        run: |
          mkdir -p out
          cp bin/donut-core.so out/donut-core.so || cp bin/hiddify-core.so out/donut-core.so
          cd out && tar -czvf donut-core-linux-amd64.tar.gz donut-core.so
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut-core
          path: out/donut-core-linux-amd64.tar.gz
