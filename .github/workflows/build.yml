name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang
          sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 100
          sudo update-alternatives --set ld /usr/bin/ld.lld

      - name: Create missing cronet env
        run: |
          mkdir -p cronet
          touch cronet/cronet.env

      - name: Update dependencies
        run: |
          cd donutvpn-sing-box
          go mod tidy
          cd ..
          go mod tidy

      - name: Build Linux amd64
        env:
          CGO_LDFLAGS: "-fuse-ld=lld"
        run: make linux-amd64

      - name: Package Artifact
        run: |
          mkdir -p out
          cp bin/lib/Donut-Core.so out/donut-core.so
          cd out && tar -czvf donut-core-linux-amd64.tar.gz donut-core.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut-core
          path: out/donut-core-linux-amd64.tar.gz
